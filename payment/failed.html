<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Failed</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f6fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            max-width: 540px;
            width: 100%;
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0,0,0,.08);
        }

        .icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: #ffe8e8;
            color: #dc2626;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        h1 {
            color: #222;
            margin-bottom: 12px;
        }

        p {
            color: #666;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .btn {
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: 600;
            transition: .2s;
        }

        .primary {
            background: #2563eb;
            color: #fff;
        }

        .secondary {
            background: #eef2ff;
            color: #2563eb;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        #tranId {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">!</div>

    <h1>Payment Failed</h1>

    <p>
        Unfortunately, we couldn't process your payment.
        This may happen due to a network issue, insufficient funds, or payment gateway problem.
        Please try again. If the issue persists, contact our support team.
    </p>

    <div class="buttons">
        <a href="javascript:history.back()" class="btn primary">Try Again</a>
        <a href="#" id="courseBtn" class="btn secondary">View Course</a>
        <a href="../../dashboard/" class="btn secondary">Dashboard</a>
        <a href="../../shop/" class="btn secondary">All Courses</a>
    </div>

    <div id="tranId"></div>

</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const tranId = params.get("tran_id");

    if (tranId) {
        document.getElementById("tranId").textContent =
            "Transaction ID: " + tranId;
    }
    // View Course button
    const courseBtn = document.getElementById("courseBtn");
    const productID = params.get("productID");
    if (productID) {
        courseBtn.href = `https://shop.aparsclassroom.com/${encodeURIComponent(productID)}`;
    } else {
        courseBtn.style.display = "none";
    }
</script>

</body>
</html>
